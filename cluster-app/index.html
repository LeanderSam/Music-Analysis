<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony | Unsupervised Clustering Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>

<body>
    <header>
        <h1>Symphony</h1>
        <p>Interactive Music Feature Clustering</p>
    </header>

    <main>
        <div class="tabs-wrapper">
            <button class="tab-btn active" data-tab="2d">2D Explorer</button>
            <button class="tab-btn" data-tab="3d">3D Explorer</button>
            <button class="tab-btn" data-tab="songs">Cluster Songs</button>
        </div>

        <div class="dashboard-top">
            <div class="controls">
            <div class="control-group">
                <label for="k-slider">Number of Clusters (k)</label>
                <div class="k-value-display" id="k-display">5</div>
                <input type="range" id="k-slider" min="2" max="15" value="5" step="1">
            </div>

            <div class="control-group" style="margin-top: 1rem;">
                <label for="x-axis">X Axis Feature</label>
                <select id="x-axis"></select>
            </div>

            <div class="control-group">
                <label for="y-axis">Y Axis Feature</label>
                <select id="y-axis"></select>
            </div>

            <div class="control-group hidden" id="z-axis-group">
                <label for="z-axis">Z Axis Feature</label>
                <select id="z-axis"></select>
            </div>

            <div class="control-group insight-box hidden" id="insight-box" style="margin-top: 1rem; padding: 1rem; background: rgba(59, 130, 246, 0.1); border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.3);">
                <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom: 0.5rem;">
                    <span style="font-size:1.2rem;">💡</span>
                    <span style="font-weight:600; color:#60a5fa; font-size:0.9rem; text-transform:uppercase;">Insight</span>
                </div>
                <div id="insight-text" style="font-size: 0.85rem; color: #e2e8f0; line-height: 1.4;">
                </div>
                <button id="apply-insight-btn" class="glow-btn hidden" style="margin-top: 0.75rem; padding: 0.5rem; font-size: 0.8rem; width: 100%;">Apply Recommendation</button>
            </div>

            <div class="control-group" style="margin-top: auto; padding-top: 1rem;">
                <button id="evaluate-btn" class="glow-btn">
                    <span class="btn-text">Evaluate Cluster Quality</span>
                    <span class="btn-icon">✨</span>
                </button>
            </div>
            </div> <!-- end controls -->

            <div class="view-content active" id="view-2d">
                <div class="chart-container">
                    <div id="loader">Initializing Audio Matrix...</div>
                    <canvas id="clusterChart"></canvas>
                </div>
                <div class="averages-container">
                    <h2>Cluster Averages</h2>
                    <div class="table-wrapper">
                        <table id="averages-table">
                            <thead id="averages-head"></thead>
                            <tbody id="averages-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="view-content hidden" id="view-3d">
                <div class="chart-container" style="padding: 0;">
                    <div id="plotly3d" style="width: 100%; height: 100%; min-height: 600px; border-radius: 20px; overflow: hidden;"></div>
                </div>
            </div>

            <div class="view-content hidden" id="view-songs">
                <div class="songs-list-container" id="songs-list">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Evaluation Modal -->
    <div id="eval-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Clustering Evaluation</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="eval-progress" class="progress-container hidden">
                    <div class="progress-spinner"></div>
                    <p id="eval-status">Calculating metrics for K=2...</p>
                    <div class="progress-bar-bg">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                </div>
                <div id="eval-charts" class="eval-charts-wrapper hidden">
                    <div class="chart-box">
                        <canvas id="elbowChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <canvas id="silhouetteChart"></canvas>
                    </div>
                </div>
                <div id="eval-stats" class="modal-stats hidden">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-best-k">-</div>
                        <div class="stat-label">Recommended K</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-sil-score">-</div>
                        <div class="stat-label">Peak Silhouette</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Payload Generated by Python -->
    <script src="data.js"></script>

    <!-- Scripts -->
    <script src="kmeans.js"></script>
    <script src="app.js"></script>
</body>

</html>
